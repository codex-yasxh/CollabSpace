services:
  postgres:
    image: postgres:16-alpine
    container_name: collabspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabspace
      POSTGRES_PASSWORD: collabspace_dev
      POSTGRES_DB: collabspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabspace -d collabspace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
