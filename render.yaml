services:
  - type: web
    name: collabspace
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: collabspace-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://collabspace.onrender.com
      - key: CLIENT_ORIGIN
        value: https://collabspace.onrender.com

databases:
  - name: collabspace-db
    plan: free
    databaseName: collabspace
    user: collabspace
